  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di browser mobile */

    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwsOUFW_T1jnebArtehzj_tzPuFBScQ8dOLfpXWWTRHmqnqBtp-XQOrHkizzAXxIIDfUw/exec"
